<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>打开听见视界无线控制台</title><style>body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#101611;color:#eef6ee;max-width:720px;margin:10vh auto;padding:24px}h1{font-size:28px}p{line-height:1.8;color:#b9cbbb}input{box-sizing:border-box;width:100%;padding:16px;font:inherit;border:1px solid #657963;border-radius:12px;background:#19241c;color:white}button{padding:14px 24px;border:0;border-radius:12px;background:#b4f58b;color:#152312;font:inherit;margin-top:20px;cursor:pointer}#error{color:#ffb9a9}</style><h1>听见视界 · 无线双眼控制台</h1><p>在手机打开听见视界 → 开启无线共享 → 点击连接状态，复制完整观看链接。电脑与手机需连接可互通的 Wi-Fi 或手机热点。</p><form id="open"><label for="url">粘贴完整链接（包括 # 后的密钥）</label><p><input id="url" type="url" required autocomplete="off" placeholder="http://手机IP:18766/#访问密钥"></p><button>打开控制台</button></form><p id="error" role="alert"></p><p>画面由手机本地生成。电脑可无线观看、调整画面和向手机发送字幕。不需要数据线或 USB 调试。</p><script>document.getElementById('open').onsubmit=e=>{e.preventDefault();try{const u=new URL(document.getElementById('url').value.trim()),parts=u.hostname.split('.').map(Number);if(u.protocol!=='http:'||u.port!=='18766'||u.username||u.password||u.pathname!=='/'||u.search||!/^#[0-9a-f]{32}$/.test(u.hash)||parts.length!==4||!parts.every(n=>Number.isInteger(n)&&n>=0&&n<256)||!(parts[0]===10||parts[0]===192&&parts[1]===168||parts[0]===172&&parts[1]>=16&&parts[1]<=31))throw Error('请粘贴手机显示的完整局域网链接。');location.assign(u.href);}catch(e){document.getElementById('error').textContent=e.message;}};</script></html>
